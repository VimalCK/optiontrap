services:
  postgres:
    image: postgres:16-alpine
    container_name: optiontrap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: optiontrap
      POSTGRES_PASSWORD: optiontrap
      POSTGRES_DB: optiontrap
    ports:
      - "5433:5432"
    volumes:
      - optiontrap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiontrap -d optiontrap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  optiontrap_pgdata:
